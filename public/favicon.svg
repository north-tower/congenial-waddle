<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#000000"/>
  
  <!-- Package/Truck Icon -->
  <g fill="#FFFFFF">
    <!-- Package Box -->
    <rect x="12" y="22" width="20" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="15" y="25" width="14" height="14" rx="1" fill="#000000" opacity="0.2"/>
    
    <!-- Tape on package -->
    <rect x="20" y="22" width="4" height="20" fill="#000000" opacity="0.3"/>
    <rect x="12" y="29" width="20" height="4" fill="#000000" opacity="0.3"/>
    
    <!-- Truck -->
    <rect x="34" y="28" width="18" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="38" y="32" width="10" height="4" fill="#000000" opacity="0.2"/>
    
    <!-- Truck Window -->
    <rect x="40" y="30" width="4" height="3" rx="0.5" fill="#000000" opacity="0.4"/>
    
    <!-- Wheels -->
    <circle cx="39" cy="42" r="3" fill="#000000"/>
    <circle cx="47" cy="42" r="3" fill="#000000"/>
    <circle cx="39" cy="42" r="1.5" fill="#FFFFFF"/>
    <circle cx="47" cy="42" r="1.5" fill="#FFFFFF"/>
    
    <!-- Comparison/Arrow indicator -->
    <path d="M 48 24 L 54 30 L 48 36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
